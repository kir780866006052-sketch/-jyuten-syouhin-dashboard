<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サービス重点商品拡販実績</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12151a;--panel:#1b2027;--line:#2b3340;--text:#eceff3;--text-dim:#8a93a3;--red:#c8102e;--qty:#5b8def;--sans:'Noto Sans JP',sans-serif;--mono:'Roboto Mono',ui-monospace,monospace;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
.topbar{border-top:4px solid var(--red);background:linear-gradient(180deg,#171b21,#12151a);padding:22px 28px;border-bottom:1px solid var(--line);}
.topbar h1{margin:0;font-size:20px;font-weight:700;}
.topbar .sub{margin-top:4px;color:var(--text-dim);font-size:12.5px;}
main{padding:28px;max-width:900px;margin:0 auto;}
.half-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:30px;}
.half-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;}
.half-card h2{margin:0 0 6px;font-size:16px;}
.half-card .months{color:var(--text-dim);font-size:12px;margin-bottom:16px;font-family:var(--mono);}
.half-card a.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;}
.half-card.disabled{opacity:.45;}
.half-card.disabled .btn{background:#3a4453;pointer-events:none;}
.section-head{font-size:14px;font-weight:700;margin:26px 0 10px;color:var(--text-dim);}
.excel-list{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 20px;}
.excel-list a{display:block;color:var(--qty);text-decoration:none;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line);font-family:var(--mono);}
.excel-list a:last-child{border-bottom:none;}
.excel-list a:hover{text-decoration:underline;}
footer{text-align:center;color:var(--text-dim);font-size:11px;padding:24px;font-family:var(--mono);}
</style>
</head>
<body>
<div class="topbar">
  <h1>サービス重点商品拡販実績</h1>
  <div class="sub">函館日産自動車 サービス支援グループ</div>
</div>
<main>
  <div class="half-grid">
    <div class="half-card">
      <h2>上期(04月〜09月)</h2>
      <div class="months">2026年4月・2026年5月・2026年6月・2026年7月・2026年8月・2026年9月</div>
      <a class="btn" href="重点商品進捗ダッシュボード_上期.html">ダッシュボードを開く</a>
    </div>
<div class="half-card disabled">
      <h2>下期</h2>
      <div class="months">データ未配置</div>
      <a class="btn" href="#">準備中</a>
    </div>
  </div>
  <div class="section-head">Excel(月別)</div><div class="excel-list"><a href="重点商品CA別進捗_2026年4月.xlsx">📊 2026年4月 Excel</a><a href="重点商品CA別進捗_2026年5月.xlsx">📊 2026年5月 Excel</a><a href="重点商品CA別進捗_2026年6月.xlsx">📊 2026年6月 Excel</a><a href="重点商品CA別進捗_2026年7月.xlsx">📊 2026年7月 Excel</a><a href="重点商品CA別進捗_2026年8月.xlsx">📊 2026年8月 Excel</a><a href="重点商品CA別進捗_2026年9月.xlsx">📊 2026年9月 Excel</a></div>
</main>
<footer>部品出庫 / 受注明細 / 受注データを突合して自動生成</footer>
</body>
</html>
